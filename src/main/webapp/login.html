<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Krishak — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="login-body">
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="customer/home">Krishak</a>
      <nav class="main-nav" aria-label="Primary">
        <a href="customer/home">Home</a>
        <a href="shop">Product</a>
        <a href="about">About Us</a>
        <a href="contact">Contact</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <section class="auth-card" aria-labelledby="login-heading">
      <div class="logo-wrap">
        <div class="logo-circle" aria-hidden="true">
          <img src="image/white_lock.png" alt="" />
        </div>
      </div>

      <div class="welcome">
        <h1 id="login-heading">Welcome back</h1>
        <p>Sign in to shop farm-fresh produce from local farmers.</p>
      </div>

      <nav class="switcher" aria-label="Authentication pages">
        <a class="switch-link active" href="login">Login</a>
        <a class="switch-link" href="register">Register</a>
      </nav>

      <form id="login-form" class="auth-form" action="login" method="post">
        <div id="login-error" class="error-box" aria-live="polite"></div>

        <div class="form-group">
          <label for="login-email">Email</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <img class="icon-img" src="image/email.png" alt="" />
            </span>
            <input id="login-email" type="email" name="email" placeholder="name@example.com" required />
          </div>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <img class="icon-img" src="image/lock.png" alt="" />
            </span>
            <input id="login-password" type="password" name="password" placeholder="Enter your password" required />
            <button class="password-toggle" type="button" data-target="login-password" aria-label="Show password">
              <img src="image/visible.png" alt="" />
            </button>
          </div>
        </div>

        <button class="submit-btn" type="submit">Sign In</button>
      </form>

      <p class="auth-switch-text">
        Don't have an account?
        <a href="register">Register</a>
      </p>

      <p class="auth-footer">
        <a href="customer/home">Home</a>
        <span class="auth-footer-sep" aria-hidden="true">·</span>
        <a href="about">About Us</a>
        <span class="auth-footer-sep" aria-hidden="true">·</span>
        <a href="contact">Contact</a>
      </p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
