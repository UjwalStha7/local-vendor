<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Krishak — Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/register.css" />
</head>
<body class="register-body">
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="shop">Krishak</a>
      <nav class="main-nav" aria-label="Primary">
        <a href="shop">Home</a>
        <a href="shop">Product</a>
        <a href="index.html#about">About Us</a>
        <a href="about#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <section class="auth-card auth-card--register" aria-labelledby="register-heading">
      <div class="logo-wrap">
        <div class="logo-circle" aria-hidden="true">
          <img src="image/white_lock.png" alt="" />
        </div>
      </div>

      <div class="welcome">
        <h1 id="register-heading">Create your account</h1>
        <p>Join Krishak and connect with fresh produce from local farmers.</p>
      </div>

      <nav class="switcher" aria-label="Authentication pages">
        <a class="switch-link" href="login">Login</a>
        <a class="switch-link active" href="register">Register</a>
      </nav>

      <form id="register-form" class="auth-form" action="register" method="post">
        <div id="register-error" class="error-box" aria-live="polite"></div>

        <div class="form-group">
          <label for="register-username">Username</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <img class="icon-img" src="image/user.png" alt="" />
            </span>
            <input id="register-username" type="text" name="username" placeholder="Your username" required />
          </div>
        </div>

        <div class="form-group">
          <label for="register-email">Email</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <img class="icon-img" src="image/email.png" alt="" />
            </span>
            <input id="register-email" type="email" name="email" placeholder="name@example.com" required />
          </div>
        </div>

        <div class="form-group">
          <label for="register-password">Password</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <img class="icon-img" src="image/lock.png" alt="" />
            </span>
            <input id="register-password" type="password" name="password" placeholder="At least 8 characters" required />
            <button class="password-toggle" type="button" data-target="register-password" aria-label="Show password">
              <img src="image/visible.png" alt="" />
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="register-confirm-password">Confirm password</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <img class="icon-img" src="image/lock.png" alt="" />
            </span>
            <input id="register-confirm-password" type="password" name="confirmed_password" placeholder="Re-enter your password" required />
            <button class="password-toggle" type="button" data-target="register-confirm-password" aria-label="Show password">
              <img src="image/visible.png" alt="" />
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="register-phone">Phone</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <img class="icon-img" src="image/phone.png" alt="" />
            </span>
            <input id="register-phone" type="tel" name="phone" placeholder="Your phone number" required />
          </div>
        </div>

        <button class="submit-btn" type="submit">Create Account</button>
      </form>

      <p class="auth-switch-text">
        Already have an account?
        <a href="login">Log in</a>
      </p>

      <p class="auth-footer">
        <a href="shop">Home</a>
        <span class="auth-footer-sep" aria-hidden="true">·</span>
        <a href="about">About Us</a>
      </p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
